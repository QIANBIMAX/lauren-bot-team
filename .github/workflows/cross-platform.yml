# Native kit CI. windows-latest is not Windows 11 desktop / OMB acceptance.
# ubuntu-24.04 is not Ubuntu desktop / OMB acceptance.
# Python scenarios run inside pytest. Bash files are thin wrappers only.
name: cross-platform

on:
  pull_request:
  push:
    branches: [main]

jobs:
  kit:
    name: kit (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
        python-version: ["3.11", "3.12"]
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Clean install
        working-directory: lauren-team-kit
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -e ".[dev]"

      # Existing Bash rule probe reads gitignored demo-app/data/tasks.json.
      # Seeding the committed fixture is not a Windows Demo port.
      - name: Seed gitignored demo fixture
        working-directory: demo-app
        run: python -c "import sys; from pathlib import Path; sys.path.insert(0, 'src'); from demo_app.seed import seed; seed(Path('fixtures/basic.json'))"

      - name: Kit pytest
        working-directory: lauren-team-kit
        run: python -m pytest tests -q --tb=short

      - name: Wheel install outside the source tree
        working-directory: lauren-team-kit
        run: python scripts/verify_wheel_install.py

      - name: What this job is not
        shell: bash
        run: |
          echo "Pytest includes lock, process, rule, and scenario tests. Do not skip those to go green."
          echo "windows-latest is not Windows 11 desktop or OMB acceptance."
          echo "ubuntu-24.04 is not Ubuntu desktop or OMB acceptance."
          echo "Job Object cancel of a Windows process tree is still windows_incomplete."
