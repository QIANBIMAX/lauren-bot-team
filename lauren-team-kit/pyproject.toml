[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lauren-team-kit"
version = "0.1.0"
description = "Lauren bot-team task protocol: validate, state machine, evidence, CLI"
readme = "README.md"
requires-python = ">=3.11"
# jsonschema is a runtime dependency so a wheel install can validate tasks
# without a separate extras step. No lock library: W3 uses stdlib fcntl/msvcrt.
dependencies = ["jsonschema>=4.0"]

[project.optional-dependencies]
schema = ["jsonschema>=4.0"]
dev = ["pytest>=7.0", "jsonschema>=4.0"]

[project.scripts]
lauren-team-kit = "lauren_team_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lauren_team_kit = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
